<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMFit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between max-w-md mx-auto bg-slate-950 font-sans antialiased text-slate-100 border-x border-slate-900">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
        <a href="{{ url_for('workout_list') }}" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-black text-sm border border-emerald-500/30">
                CM
            </div>
            <span class="font-extrabold text-base tracking-tight text-white">CMFit</span>
        </a>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 p-4 pb-20 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-950/90 backdrop-blur-md border-t border-slate-800/80 py-2.5 px-6 flex justify-around items-center z-50">
        <a href="{{ url_for('exercise_list') }}" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition text-xs font-semibold">
            <i class="fa-solid fa-dumbbell text-base"></i>
            <span>Exercises</span>
        </a>
        <a href="{{ url_for('workout_list') }}" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition text-xs font-semibold">
            <i class="fa-solid fa-list-check text-base"></i>
            <span>Workouts</span>
        </a>
        <a href="{{ url_for('progress') }}" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition text-xs font-semibold">
            <i class="fa-solid fa-chart-line text-base"></i>
            <span>Progress</span>
        </a>
    </nav>

</body>
</html>
