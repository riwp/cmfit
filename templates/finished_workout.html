{% extends 'base.html' %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh] px-4 py-8">
    <div class="glass-card w-full max-w-sm p-8 rounded-3xl text-center space-y-6 relative overflow-hidden border border-emerald-500/20 shadow-2xl">
        <!-- Glow Effect Backdrop -->
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-32 h-32 bg-emerald-500/20 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Trophy Icon Badge -->
        <div class="relative mx-auto w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-400/20 to-emerald-600/10 border border-emerald-500/40 flex items-center justify-center shadow-lg shadow-emerald-500/10">
            <i class="fa-solid fa-trophy text-3xl text-emerald-400 animate-bounce"></i>
        </div>

        <!-- Text Content -->
        <div class="space-y-2">
            <h2 class="text-2xl font-black text-slate-100 tracking-tight">Workout Finished!</h2>
            <p class="text-xs text-slate-400 font-medium leading-relaxed max-w-xs mx-auto">
                Great job! All exercise sets have been logged successfully.
            </p>
        </div>

        <!-- Action Button -->
        <div class="pt-2">
            <a href="{{ url_for('workout_list') }}" class="btn-emerald-full shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-house text-xs"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.playCMFitSound === 'function') {
        window.playCMFitSound('end');
    }
});
</script>
{% endblock %}
