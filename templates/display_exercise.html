{% extends 'base.html' %}
{% block content %}
<form method="POST" enctype="multipart/form-data" class="glass-card p-5 rounded-2xl mb-6">
    <!-- Hidden Field to Track Previous Page -->
    <input type="hidden" name="next_url" value="{{ next_url }}">

    <!-- Top Bar Navigation -->
    <div class="flex items-center justify-between mb-4">
        <a href="{{ next_url }}" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 font-semibold transition">
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
            Back
        </a>
        {% if exercise_idx is defined and total_exercises is defined %}
        <span class="text-xs font-bold text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-lg">
            Exercise {{ exercise_idx + 1 }} of {{ total_exercises }}
        </span>
        {% endif %}
    </div>

    <!-- Exercise Name -->
    <div class="mb-4">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Exercise Name</label>
        <input type="text" name="name" value="{{ exercise.name }}" required 
               class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-base font-bold text-slate-100 focus:outline-none focus:border-emerald-500 transition">
    </div>

    <!-- Muscle Groups -->
    <div class="mb-4">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Target Muscle Groups</label>
        <div class="grid grid-cols-2 gap-2 max-h-32 overflow-y-auto p-2 bg-slate-900 border border-slate-800 rounded-xl">
            {% for m in muscle_groups %}
            <label class="flex items-center gap-2 text-xs text-slate-300">
                <input type="checkbox" name="muscles" value="{{ m }}" {{ 'checked' if exercise.muscles and m in exercise.muscles }} class="accent-emerald-500">
                <span>{{ m }}</span>
            </label>
            {% endfor %}
        </div>
    </div>

    <!-- Image -->
    <div class="mb-4">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Exercise Image</label>
        {% if exercise.image %}
        <div class="mb-2 rounded-xl overflow-hidden border border-slate-800 bg-slate-900 max-h-48">
            <img src="{{ url_for('static', filename='uploads/' + exercise.image) }}" alt="{{ exercise.name }}" class="w-full h-full object-cover">
        </div>
        {% endif %}
        <input type="file" name="image" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-emerald-400 hover:file:bg-slate-700">
    </div>

    <!-- Sets, Reps, Rest -->
    <div class="grid grid-cols-3 gap-2 mb-4 p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-center">
        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Sets</label>
            <input type="number" name="sets" value="{{ exercise.sets }}" min="1" required 
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg py-1 px-2 text-center text-sm font-bold text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Reps</label>
            <input type="number" name="reps" value="{{ exercise.reps }}" min="1" required 
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg py-1 px-2 text-center text-sm font-bold text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Rest (s)</label>
            <input type="number" name="rest" value="{{ exercise.rest }}" min="0" required 
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg py-1 px-2 text-center text-sm font-bold text-white focus:outline-none focus:border-emerald-500">
        </div>
    </div>

    <!-- Instructions -->
    <div class="mb-4">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Instructions</label>
        <textarea name="instructions" rows="3" 
                  class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">{{ exercise.instructions or '' }}</textarea>
    </div>

    <!-- Link -->
    <div class="mb-5">
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Demo / Web Link</label>
        <input type="url" name="link" value="{{ exercise.link or '' }}" placeholder="https://..." 
               class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 transition">
    </div>

    <!-- Save Button -->
    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/10">
        Save Changes
    </button>
</form>
{% endblock %}
