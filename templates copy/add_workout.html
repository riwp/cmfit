{% extends 'base.html' %}
{% block content %}
<div class="space-y-5">
    <!-- Top Navigation Header -->
    <div class="flex items-center justify-between pb-3 border-b border-white/5">
        <a href="{{ url_for('workout_list') }}" class="flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
            <span>Workouts</span>
        </a>
        <h1 class="text-base font-black text-slate-100 tracking-tight">Create Workout</h1>
        <div class="w-10"></div> <!-- Balance spacer -->
    </div>

    <!-- Flash Validation Errors -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flex items-center gap-2.5 p-3.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold rounded-2xl">
            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Create Workout Form Card (Added !overflow-visible to prevent shadow clipping) -->
    <div class="glass-card p-5 rounded-2xl !overflow-visible">
        <form action="{{ url_for('add_workout') }}" method="POST" class="space-y-4">
            <!-- Title Input -->
            <div>
                <label for="title" class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">
                    Workout Title <span class="text-emerald-400">*</span>
                </label>
                <input type="text" id="title" name="title" value="{{ title or '' }}" required placeholder="e.g., Upper Body Hypertrophy, Leg Day" 
                       class="w-full bg-slate-950/80 border border-white/10 rounded-xl px-3.5 py-3 text-slate-100 placeholder-slate-500 text-xs font-medium focus:outline-none focus:border-emerald-500/50 transition">
            </div>

            <!-- Description Input -->
            <div>
                <label for="description" class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">
                    Description <span class="text-[10px] font-normal text-slate-500 uppercase tracking-normal">(Optional)</span>
                </label>
                <textarea id="description" name="description" rows="3" placeholder="Focus on heavy compounds, tempo work, and chest isolation..." 
                          class="w-full bg-slate-950/80 border border-white/10 rounded-xl p-3.5 text-slate-100 placeholder-slate-500 text-xs font-medium focus:outline-none focus:border-emerald-500/50 transition resize-none">{{ description or '' }}</textarea>
            </div>

            <!-- Action Button Wrapper (Added p-1 padding buffer so the glow has room) -->
            <div class="pt-2 p-1 overflow-visible">
                <button type="submit" class="btn-emerald-full">
                    <span>{% if exercise %}Save Changes{% else %}Continue to Add Exercises{% endif %}</span>
                    <i class="fa-solid {% if exercise %}fa-check{% else %}fa-arrow-right{% endif %} text-xs"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
