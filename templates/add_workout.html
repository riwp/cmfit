{% extends 'base.html' %}
{% block content %}
<div class="glass-card p-5 rounded-2xl mb-6">
    <div class="flex items-center justify-between mb-4">
        <a href="{{ url_for('workout_list') }}" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 font-semibold transition">
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
            Back to Workouts
        </a>
    </div>

    <h2 class="text-xl font-bold text-slate-100 mb-4">Create New Workout</h2>

    <!-- Flash error message if validation fails -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-xl font-medium">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('add_workout') }}" method="POST">
        <!-- Title Input -->
        <div class="mb-4">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Workout Title *</label>
            <input type="text" name="title" value="{{ title or '' }}" required placeholder="e.g. Upper Body Push, Leg Day" 
                   class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm font-semibold text-slate-100 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <!-- Description Input -->
        <div class="mb-5">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Description (Optional)</label>
            <textarea name="description" rows="3" placeholder="Focus on chest and shoulders..." 
                      class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">{{ description or '' }}</textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/10">
            Continue to Add Exercises
        </button>
    </form>
</div>
{% endblock %}
