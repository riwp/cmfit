{% extends 'base.html' %}
{% block content %}
<div class="glass-card p-5 rounded-2xl">
    <h2 class="text-xl font-bold mb-4">Create Workout</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Workout Name</label>
            <input type="text" name="name" required placeholder="e.g., Upper Body Power" 
                   class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition">
            Save & Add Exercises
        </button>
    </form>
</div>
{% endblock %}
